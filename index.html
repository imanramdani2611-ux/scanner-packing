<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Scanner Pesanan</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 22px 16px 30px;
      text-align: center;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 30px;
      margin: 8px 0 24px;
      line-height: 1.2;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      min-height: 280px;
      margin: 0 auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    #hasil {
      width: 100%;
      max-width: 520px;
      margin: 20px auto 0;
      padding: 20px 16px;
      background: #fff;
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.4;
      word-break: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    button {
      display: block;
      width: 100%;
      max-width: 520px;
      min-height: 64px;
      margin: 18px auto 0;
      border: 0;
      border-radius: 14px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #btnScan {
      background: #1677ff;
      color: white;
    }

    #pilihan {
      display: none;
      width: 100%;
      max-width: 520px;
      margin: 22px auto 0;
      padding: 22px 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    #pertanyaan {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.25;
    }

    #btnAda {
      background: #20a464;
      color: white;
    }

    #btnBelum {
      background: #e64b4b;
      color: white;
    }

    .info {
      font-size: 17px;
      margin-top: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>📷 SCAN RESI PESANAN</h1>

  <div id="reader"></div>

  <div id="hasil">
    Belum ada nomor pesanan
  </div>

  <button id="btnScan" onclick="mulaiScanner()">
    📷 MULAI SCAN
  </button>

  <div id="pilihan">
    <div id="pertanyaan">
      NOTANYA UDAH ADA?
    </div>

    <button id="btnAda" onclick="pilihAda()">
      ✅ ADA NIH
    </button>

    <button id="btnBelum" onclick="pilihBelum()">
      ❌ BELUM EUY
    </button>

    <div class="info">
      Kalau notanya belum ada, status tetap FINISHING.
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <script>
  let scanner = null;
  let nomorPesanan = "";
  let sedangScan = false;

  function mulaiScanner() {

    if (sedangScan) return;

    sedangScan = true;

    const hasil = document.getElementById("hasil");
    const btnScan = document.getElementById("btnScan");
    const pilihan = document.getElementById("pilihan");

    pilihan.style.display = "none";

    hasil.innerText = "📷 Menyiapkan kamera...";
    btnScan.disabled = true;
    btnScan.style.opacity = "0.6";

    scanner = new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 140
        },
        aspectRatio: 1.777778
      },

      function(decodedText) {

        nomorPesanan = decodedText.trim();

        hasil.innerText =
          "✅ Nomor Pesanan:\n" + nomorPesanan;

        scanner.stop().then(function() {

          scanner.clear();
          scanner = null;
          sedangScan = false;

          btnScan.disabled = false;
          btnScan.style.opacity = "1";
          btnScan.innerText = "📷 SCAN LAGI";

          pilihan.style.display = "block";

        }).catch(function() {

          scanner = null;
          sedangScan = false;

          btnScan.disabled = false;
          btnScan.style.opacity = "1";

          pilihan.style.display = "block";
        });

      },

      function(errorMessage) {
        // Error scan diabaikan selama kamera masih aktif
      }

    ).then(function() {

      // INI YANG SEBELUMNYA BELUM ADA
      hasil.innerText =
        "🟢 KAMERA AKTIF\nArahkan kamera ke QR pesanan";

    }).catch(function(error) {

      console.error(error);

      hasil.innerText =
        "❌ Kamera tidak bisa dibuka.\n\n" +
        "Pastikan izin kamera browser sudah aktif.";

      scanner = null;
      sedangScan = false;

      btnScan.disabled = false;
      btnScan.style.opacity = "1";
    });
  }


  function pilihAda() {

    document.getElementById("hasil").innerText =
      "Nomor Pesanan: " + nomorPesanan +
      "\n\n⏳ Memproses ANTRIAN PACKING...";

    // NANTI kita sambungkan ke Apps Script
  }


  function pilihBelum() {

    document.getElementById("hasil").innerText =
      "Nomor Pesanan: " + nomorPesanan +
      "\n\nStatus tetap FINISHING.";

    document.getElementById("pilihan").style.display = "none";

    nomorPesanan = "";

    const btnScan = document.getElementById("btnScan");

    btnScan.innerText = "📷 MULAI SCAN";
  }
</script>
