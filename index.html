<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scan Resi Pesanan</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin: 10px 0 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    #hasil {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
      font-size: 20px;
    }

    #pilihan {
      display: none;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
    }

    #pertanyaan {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #btnAda {
      background: #28a745;
      color: white;
    }

    #btnBelum {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .nomor {
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .info {
      margin-top: 12px;
      font-size: 15px;
      color: #666;
    }

    .loading {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
    }

    .judul-desain {
      font-size: 22px;
      font-weight: bold;
      margin-top: 25px;
      margin-bottom: 12px;
    }

    .desain-final {
      width: 100%;
      max-width: 500px;
      margin: 10px auto 0;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.18);
      cursor: pointer;
      display: block;
    }

    .keterangan-gambar {
      font-size: 14px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <h1>📷 SCAN RESI PESANAN</h1>

  <div id="reader"></div>

  <div id="hasil">
    <span class="loading">
      📷 Kamera sedang dibuka...<br>
      Arahkan kamera ke barcode pesanan.
    </span>
  </div>

  <div id="pilihan">

    <div id="pertanyaan">
      PESANAN SEDANG DALAM FINISHING
    </div>

    <div id="nomorTampil" class="nomor"></div>

    <button id="btnAda" onclick="pilihBeres()">
      📦 BERES NIH
    </button>

    <button id="btnBelum" onclick="pilihBelum()">
      ❌ BELUM EUY
    </button>

    <div class="info">
      Pilih sesuai kondisi pesanan.
    </div>

  </div>


<script>

  // =========================================================
  // URL APPS SCRIPT
  // =========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxZ21H82DMjB6BlUx03DiLTzguwcxE3dw1-8mYOvKk3FC1aBKNLCoB59_ib8cRf451fyA/exec";


  // =========================================================
  // VARIABEL
  // =========================================================

  let scanner = null;
  let nomorPesanan = "";
  let sedangMemproses = false;
  let statusPesananSaatIni = "";


  // =========================================================
  // MULAI SCANNER
  // =========================================================

  function mulaiScanner() {

    scanner = new Html5Qrcode("reader");

    scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,

        qrbox: {
          width: 300,
          height: 150
        },

        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128
        ]
      },

      function(decodedText) {

        if (sedangMemproses) return;

        nomorPesanan = decodedText.trim();

        if (!nomorPesanan) return;

        sedangMemproses = true;

        cekPesanan(nomorPesanan);

      },

      function(errorMessage) {
        // Tidak perlu menampilkan error scanner
      }

    ).catch(function(err) {

      document.getElementById("hasil").innerHTML =
        "❌ <b>KAMERA TIDAK BISA DIBUKA</b><br><br>" +
        "Pastikan izin kamera sudah diberikan.";

    });

  }


  // =========================================================
  // TAMPILKAN GAMBAR DESAIN FINAL
  // =========================================================

  function tampilkanDesainFinal(gambar) {

    if (!gambar) return;

    if (!gambar.success) return;

    if (!gambar.base64) return;

    const hasil = document.getElementById("hasil");

    const mimeType =
      gambar.mimeType || "image/jpeg";

    const gambarSrc =
      "data:" + mimeType + ";base64," + gambar.base64;


    hasil.innerHTML +=

      '<div class="judul-desain">' +
        '🖼️ DESAIN FINAL' +
      '</div>' +

      '<img ' +
        'src="' + gambarSrc + '" ' +
        'class="desain-final" ' +
        'onclick="window.open(this.src, \'_blank\')" ' +
        'alt="Desain Final">' +

      '<div class="keterangan-gambar">' +
        'Klik gambar untuk melihat ukuran besar' +
      '</div>';

  }


  // =========================================================
  // CEK PESANAN
  // =========================================================

  function cekPesanan(nomor) {

    const callbackName =
      "callbackCek" + Date.now();


    window[callbackName] = function(data) {

      try {

        if (!data) {

          tampilkanPesan(
            "❌ TERJADI KESALAHAN",
            "Data dari server kosong."
          );

          return;
        }


        if (!data.ditemukan) {

          tampilkanPesan(
            "❌ NOTA BELUM MASUK PROSES FINISHING",
            "MASIH DICETAK KAYAKNYA"
          );

          return;
        }


        const status =
          String(data.status || "").trim().toUpperCase();


        statusPesananSaatIni = status;


        // =================================================
        // FINISHING
        // =================================================

        if (status === "FINISHING") {

          document.getElementById("hasil").innerHTML =
            "🟡 <b>NOTA SEDANG DALAM FINISHING</b>";

          document.getElementById("nomorTampil").innerText =
            "Nomor Pesanan: " + nomor;

          document.getElementById("pertanyaan").innerText =
            "PESANAN SEDANG DALAM FINISHING";

          document.getElementById("btnAda").innerText =
            "📦 BERES NIH";

          document.getElementById("btnBelum").innerText =
            "❌ BELUM EUY";

          document.querySelector("#pilihan .info").innerText =
            "Kalau belum selesai, status tetap FINISHING.";

          document.getElementById("pilihan").style.display =
            "block";


          // TAMPILKAN GAMBAR
          if (data.gambar && data.gambar.success) {

            tampilkanDesainFinal(data.gambar);

          }


          return;
        }


        // =================================================
        // ANTRIAN PACKING
        // =================================================

        if (status === "ANTRIAN PACKING") {

          document.getElementById("hasil").innerHTML =
            "🟠 <b>NOTA-NYA UDAH DI PACKING NIH</b>";

          document.getElementById("nomorTampil").innerText =
            "Nomor Pesanan: " + nomor;

          document.getElementById("pertanyaan").innerText =
            "NOTA-NYA UDAH DI PACKING NIH";

          document.getElementById("btnAda").innerText =
            "📦 IYA UDAH";

          document.getElementById("btnBelum").innerText =
            "❌ BELUM HEHE";

          document.querySelector("#pilihan .info").innerText =
            "Kalau belum selesai, status tetap ANTRIAN PACKING.";

          document.getElementById("pilihan").style.display =
            "block";


          // TAMPILKAN GAMBAR
          if (data.gambar && data.gambar.success) {

            tampilkanDesainFinal(data.gambar);

          }


          return;
        }


        // =================================================
        // SUDAH PACKING
        // =================================================

        if (status === "SUDAH PACKING") {

          document.getElementById("hasil").innerHTML =
            "🟢 <b>NOTA SUDAH DI PACKING</b><br><br>" +
            "SIAP KIRIM";

          document.getElementById("nomorTampil").innerText =
            "Nomor Pesanan: " + nomor;

          document.getElementById("pilihan").style.display =
            "none";


          // TAMPILKAN GAMBAR JUGA
          if (data.gambar && data.gambar.success) {

            tampilkanDesainFinal(data.gambar);

          }


          setTimeout(function() {

            resetScanner();

          }, 3500);


          return;
        }


        // =================================================
        // STATUS LAIN
        // =================================================

        tampilkanPesan(
          "ℹ️ STATUS PESANAN",
          status + "<br><br>Nomor Pesanan: " + nomor
        );

      }

      finally {

        delete window[callbackName];

      }

    };


    const script =
      document.createElement("script");


    script.src =
      API_URL +
      "?action=check" +
      "&nomor=" +
      encodeURIComponent(nomor) +
      "&callback=" +
      callbackName;


    script.onerror = function() {

      tampilkanPesan(
        "❌ GAGAL TERHUBUNG KE SERVER",
        "Coba scan lagi."
      );

      delete window[callbackName];

    };


    document.body.appendChild(script);

  }


  // =========================================================
  // TOMBOL BERES
  // =========================================================

  function pilihBeres() {

    if (sedangMemproses === false) {
      return;
    }


    const btnAda =
      document.getElementById("btnAda");

    const btnBelum =
      document.getElementById("btnBelum");


    btnAda.disabled = true;
    btnBelum.disabled = true;


    const callbackName =
      "callbackBeres" + Date.now();


    window[callbackName] = function(data) {

      try {

        if (!data || !data.success) {

          tampilkanPesan(
            "❌ GAGAL",
            data && data.message
              ? data.message
              : "Terjadi kesalahan."
          );

          return;
        }


        if (data.berubah) {

          if (
            String(data.status || "")
              .trim()
              .toUpperCase() === "SUDAH PACKING"
          ) {

            tampilkanPesan(
              "🟢 NOTA SUDAH DI PACKING",
              "SIAP KIRIM"
            );

          } else {

            tampilkanPesan(
              "🟠 PESANAN MASUK ANTRIAN PACKING",
              "Silakan lanjutkan proses packing."
            );

          }

        } else {

          tampilkanPesan(
            "ℹ️ STATUS TIDAK BERUBAH",
            data.message || ""
          );

        }

      }

      finally {

        delete window[callbackName];

      }

    };


    const script =
      document.createElement("script");


    script.src =
      API_URL +
      "?action=beres" +
      "&nomor=" +
      encodeURIComponent(nomorPesanan) +
      "&callback=" +
      callbackName;


    script.onerror = function() {

      tampilkanPesan(
        "❌ GAGAL TERHUBUNG KE SERVER",
        "Coba lagi."
      );

      delete window[callbackName];

    };


    document.body.appendChild(script);

  }


  // =========================================================
  // TOMBOL BELUM
  // =========================================================

  function pilihBelum() {

    document.getElementById("pilihan").style.display =
      "none";


    document.getElementById("hasil").innerHTML =
      "🟡 <b>STATUS TETAP FINISHING</b><br><br>" +
      "Pesanan belum dianggap selesai.";


    setTimeout(function() {

      resetScanner();

    }, 2500);

  }


  // =========================================================
  // TAMPILKAN PESAN
  // =========================================================

  function tampilkanPesan(judul, keterangan) {

    document.getElementById("pilihan").style.display =
      "none";


    document.getElementById("hasil").innerHTML =

      "<b>" +
      judul +
      "</b>" +

      "<br><br>" +

      keterangan;


    setTimeout(function() {

      resetScanner();

    }, 2500);

  }


  // =========================================================
  // RESET SCANNER
  // =========================================================

  function resetScanner() {

    sedangMemproses = false;

    nomorPesanan = "";

    statusPesananSaatIni = "";


    document.getElementById("pilihan").style.display =
      "none";


    document.getElementById("hasil").innerHTML =

      '<span class="loading">' +
      '📷 Kamera siap...<br>' +
      'Arahkan kamera ke barcode pesanan.' +
      '</span>';

  }


  // =========================================================
  // JALANKAN SAAT HALAMAN DIBUKA
  // =========================================================

  window.addEventListener(
    "load",
    function() {

      mulaiScanner();

    }
  );

</script>

</body>
</html>
